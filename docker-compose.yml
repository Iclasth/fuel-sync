services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuel-sync-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-placeholder-key}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL}
      - GROQ_TIMEOUT_MS=${GROQ_TIMEOUT_MS}
      - DATABASE_URL=${DATABASE_URL}
      - ROUTING_TORTUOSITY_FACTOR=${ROUTING_TORTUOSITY_FACTOR}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend
    networks:
      - fuel-sync-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuel-sync-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_TARGET=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - fuel-sync-network

networks:
  fuel-sync-network:
    driver: bridge
